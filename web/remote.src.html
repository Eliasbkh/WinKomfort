<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content"><meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme:dark)"><title>Mac</title><style>
:root{--bg:#f2f2f5;--card:#fff;--press:#e3e3e8;--text:#17171a;--sub:#5d5d66;--acc:#0a66ff;--on:#fff;--err:#c4281c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f11;--card:#1e1e22;--press:#2c2c32;--text:#f4f4f6;--sub:#a2a2ac;--acc:#4c8dff;--on:#06122b;--err:#ff7a6e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:16px/1.35 system-ui,sans-serif;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:14px 20px 8px}h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

button{font:inherit;font-weight:550;color:inherit;border:0;background:var(--card);border-radius:22px;min-height:56px;padding:10px 14px;touch-action:manipulation;transition:background .1s,transform .1s}
button:active{background:var(--press);transform:scale(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}button:disabled{opacity:.45}
.pri{background:var(--acc);color:var(--on)}#pad{flex:1;background:var(--card);border-radius:28px;touch-action:none;display:grid;place-items:center;color:var(--sub);text-align:center;padding:20px;min-height:120px}#pad.hold{background:var(--press)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto;align-content:start}
.big{flex:1;font-size:22px;border-radius:28px}nav{display:flex;gap:4px;padding:8px 10px 12px}nav button{flex:1;background:none;min-height:56px;padding:4px 0;font-size:12px;color:var(--sub);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center}nav button[aria-selected=true]{color:var(--acc)}
svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.row svg,.big svg{width:30px;height:30px}
textarea{font:inherit;width:100%;flex:1;min-height:90px;resize:none;border:0;border-radius:22px;background:var(--card);color:inherit;padding:16px;user-select:text;-webkit-user-select:text}
.note{color:var(--sub);font-size:14px;margin:0 6px}#msg{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;padding:32px;z-index:5}#msg.on{display:grid}#msg p{max-width:30ch;font-size:18px}

@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
@media(orientation:landscape) and (max-height:480px){header{display:none}main{padding-top:12px}nav{padding:2px 10px 6px}nav button{flex-direction:row;min-height:48px;gap:8px}}
</style></head><body>
<header><h1 id="name">Mac</h1><span id="dot" role="status"></span></header>
<main>

<section id="s-media"><button class="big" data-sys="playPause" data-a="play"><svg viewBox="0 0 24 24"><path d="M5 5v14l9-7zM18 5v14M21 5v14"/></svg></button><div class="row"><button data-sys="previousTrack" data-a="prev"><svg viewBox="0 0 24 24"><path d="M18 5v14l-9-7zM6 5v14"/></svg></button><button data-sys="nextTrack" data-a="next"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM18 5v14"/></svg></button></div><div class="row"><button data-sys="volumeDown" data-a="vdown"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 12h4"/></svg></button><button data-sys="mute" data-a="mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg></button><button data-sys="volumeUp" data-a="vup"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 12h5M19.500 9.500v5"/></svg></button></div></section>
<section id="s-show"><button class="big pri" data-key="right" data-t="nexts"></button><button class="big" data-key="left" data-t="prevs"></button><div class="row"><button data-key="black" data-t="black"></button><button data-key="esc" data-t="ends"></button></div></section>
<section id="s-more"><button class="pri" id="screen" data-t="screen"></button><p class="note" data-t="screenNote"></p><div class="grid" id="apps"></div><div class="grid"><button data-sys="missionControl">Mission Control</button><button data-sys="showDesktop" data-t="desk"></button><button data-key="spaceL" data-t="spl"></button><button data-key="spaceR" data-t="spr"></button><button data-sys="fullscreen" data-t="full"></button><button data-sys="dark" data-t="dark"></button><button data-sys="displayOff" data-t="off"></button><button data-sys="lock" data-t="lock"></button></div></section>
</main>
<nav role="tablist"><button role="tab" aria-selected="true" data-s="pad"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15h18M12 15v4"/></svg><span data-t="tPad"></span></button><button role="tab" aria-selected="false" data-s="keys"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg><span data-t="tKeys"></span></button><button role="tab" aria-selected="false" data-s="media"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="17.500" cy="16" r="2.500"/></svg><span data-t="tMedia"></span></button><button role="tab" aria-selected="false" data-s="show"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span data-t="tShow"></span></button><button role="tab" aria-selected="false" data-s="more"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span data-t="tMore"></span></button></nav>
<div id="scr"><canvas></canvas><button id="leave" data-a="leave"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><video id="awake" muted playsinline loop hidden></video></div>
<div id="msg" class="on" role="alert"><div><p id="mt"></p><button class="pri" id="again" hidden data-t="again"></button></div></div>
<script>
/*CRYPTO*/
const T={de:{click:'Klick',rclick:'Rechtsklick',send:'Auf dem Mac eingeben',copy:'Kopieren',paste:'Einsetzen',undo:'Zurück',nexts:'Weiter',prevs:'Zurück',black:'Schwarz',ends:'Beenden',screen:'Als zweiten Bildschirm nutzen',screenNote:'Halte das Handy dafür quer.',desk:'Schreibtisch',spl:'Space links',spr:'Space rechts',full:'Vollbild',dark:'Hell/Dunkel',off:'Bildschirm aus',lock:'Sperren',tPad:'Trackpad',tKeys:'Tastatur',tMedia:'Medien',tShow:'Folien',tMore:'Mehr',again:'Neu verbinden',pad:'Wischen bewegt, tippen klickt.<br>Zwei Finger scrollen.<br>Lange halten zieht.',ph:'Text hier schreiben …',con:'Verbindet …',ask:'Bitte am Mac „Erlauben“ klicken.',ok:'Verbunden',nokey:'Bitte scanne den QR-Code in WinKomfort auf dem Mac.',lost:'Verbindung getrennt. Ist das Fenster am Mac noch offen?',play:'Wiedergabe oder Pause',prev:'Vorheriger Titel',next:'Nächster Titel',vdown:'Leiser',vup:'Lauter',mute:'Ton aus',leave:'Zweiten Bildschirm beenden'},
en:{click:'Click',rclick:'Right-click',send:'Type on the Mac',copy:'Copy',paste:'Paste',undo:'Undo',nexts:'Next',prevs:'Back',black:'Black',ends:'End',screen:'Use as second display',screenNote:'Hold your phone sideways for this.',desk:'Desktop',spl:'Space left',spr:'Space right',full:'Full screen',dark:'Light/Dark',off:'Display off',lock:'Lock',tPad:'Trackpad',tKeys:'Keyboard',tMedia:'Media',tShow:'Slides',tMore:'More',again:'Reconnect',pad:'Swipe to move, tap to click.<br>Two fingers scroll.<br>Hold to drag.',ph:'Write text here…',con:'Connecting…',ask:'Please click “Allow” on your Mac.',ok:'Connected',nokey:'Please scan the QR code in WinKomfort on your Mac.',lost:'Disconnected. Is the window on the Mac still open?',play:'Play or pause',prev:'Previous track',next:'Next track',vdown:'Volume down',vup:'Volume up',mute:'Mute',leave:'Leave second display'}};
const $=q=>document.querySelector(q),$$=q=>document.querySelectorAll(q);let t;
function lang(l){t=T[l]||T.en;document.documentElement.lang=l;$$('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);$$('[data-a]').forEach(e=>e.setAttribute('aria-label',t[e.dataset.a]));$('#pad').innerHTML='<span>'+t.pad+'</span>';$('#txt').placeholder=t.ph}
lang(navigator.language.startsWith('de')?'de':'en');
let key=null;try{const b=atob(location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/'));if(b.length===32)key=Uint8Array.from(b,c=>c.charCodeAt(0))}catch{}
let tok='',ws,tx,rx,up=false,tries=0;
function show(m,again){$('#mt').textContent=m;$('#again').hidden=!again;$('#msg').classList.add('on')}
function connect(){if(!key){show(t.nokey);return}show(t.con);const mine=crypto.getRandomValues(new Uint8Array(16));tx=rx=null;up=false;ws=new WebSocket('ws://'+location.host+'/ws');ws.binaryType='arraybuffer';const me=ws;
ws.onopen=()=>me.send(mine);
ws.onmessage=e=>{const d=new Uint8Array(e.data);if(!tx){const s=cat(mine,d);tx=new Channel(key,'c2s',s);rx=new Channel(key,'s2c',s);show(t.ask);send({t:'hi',k:tok});return}const p=rx.open(d);if(!p){me.close();return}if(p[0]===1){frame(p.subarray(1));return}on(JSON.parse(new TextDecoder().decode(p.subarray(1))))};
ws.onclose=()=>{if(me!==ws)return;up=false;leave(true);$('#dot').textContent='';if(tries++<3)setTimeout(connect,600*tries);else show(t.lost,true)}}
function send(o){if(tx&&ws.readyState===1)ws.send(tx.seal(new TextEncoder().encode(JSON.stringify(o))))}
function on(m){if(m.t==='info'){up=true;tok=m.k;tries=0;lang(m.lang);$('#name').textContent=m.name;document.title=m.name;$('#dot').textContent=t.ok;$('#msg').classList.remove('on');$('#apps').replaceChildren(...m.apps.map(a=>{const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>{buzz();send({t:'app',id:a.id})};return b}))}else if(m.t==='noscreen')leave(true);else if(m.t==='err'){leave(true);alert(m.m)}}
$('#again').onclick=()=>{tries=0;connect()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ws&&ws.readyState>1){tries=0;connect()}});
const buzz=(n=8)=>navigator.vibrate&&navigator.vibrate(n);
$$('[data-key]').forEach(b=>b.onclick=()=>{buzz();send({t:'key',k:b.dataset.key})});
$$('[data-sys]').forEach(b=>b.onclick=()=>{buzz();send({t:'sys',k:b.dataset.sys})});
$$('[data-click]').forEach(b=>b.onclick=()=>{buzz();send({t:'click',r:b.dataset.click==='r',n:1})});
$('#send').onclick=()=>{const v=$('#txt').value;if(v){buzz();for(let i=0;i<v.length;i+=400)send({t:'text',s:v.slice(i,i+400)});$('#txt').value=''}};
$$('nav button').forEach(b=>b.onclick=()=>{buzz(4);$$('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));$$('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.s))});
// Trackpad
{const pad=$('#pad'),pts=new Map;let moved,start,max,hold,drag,lastTap=0,ax=0,ay=0,sx=0,sy=0,raf=0;
const flush=()=>{raf=0;if(ax||ay){send({t:'move',x:+ax.toFixed(1),y:+ay.toFixed(1)});ax=ay=0}if(sx||sy){send({t:'scroll',x:Math.round(sx),y:Math.round(sy)});sx=sy=0}};
const q=()=>{if(!raf)raf=requestAnimationFrame(flush)};
pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){moved=0;start=e.timeStamp;max=1;hold=setTimeout(()=>{if(moved<8&&pts.size===1&&max===1){drag=true;pad.classList.add('hold');buzz(20);send({t:'down'})}},380)}else{max=Math.max(max,pts.size);clearTimeout(hold)}};
pad.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.hypot(dx,dy);if(moved>8&&!drag)clearTimeout(hold);if(moved<4)return;if(pts.size===1&&max===1){const v=Math.hypot(dx,dy),g=1.3+Math.min(v/9,2.2);ax+=dx*g;ay+=dy*g}else if(pts.size>1){sx+=dx*1.2;sy+=dy*1.2}q()};
const end=e=>{if(!pts.delete(e.pointerId))return;if(pts.size)return;clearTimeout(hold);flush();if(drag){drag=false;pad.classList.remove('hold');send({t:'up'});return}if(e.type==='pointerup'&&moved<8&&e.timeStamp-start<260){buzz();const dbl=max===1&&e.timeStamp-lastTap<320;send({t:'click',r:max>1,n:dbl?2:1});lastTap=max===1&&!dbl?e.timeStamp:0}};
pad.onpointerup=pad.onpointercancel=end}
// Zweiter Bildschirm
const scr=$('#scr'),cv=scr.querySelector('canvas'),ctx=cv.getContext('2d',{alpha:false});let showing=false;
$('#screen').onclick=async()=>{buzz();try{await document.documentElement.requestFullscreen()}catch{}try{await screen.orientation.lock('landscape')}catch{}
await new Promise(r=>setTimeout(r,450));showing=true;scr.classList.add('on');const w=Math.max(innerWidth,innerHeight),h=Math.min(innerWidth,innerHeight),f=Math.min(1.5,1600/w);send({t:'screen',w:Math.round(w*f),h:Math.round(h*f)});
try{const v=$('#awake');v.srcObject=cv.captureStream(1);await v.play()}catch{}};
async function frame(d){try{const b=await createImageBitmap(new Blob([d],{type:'image/jpeg'}));if(cv.width!==b.width||cv.height!==b.height){cv.width=b.width;cv.height=b.height}ctx.drawImage(b,0,0);b.close()}catch{}send({t:'got'})}
function leave(remote){if(!showing)return;showing=false;scr.classList.remove('on');$('#awake').srcObject=null;if(!remote)send({t:'noscreen'});if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});try{screen.orientation.unlock()}catch{}}
$('#leave').onclick=()=>leave();document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&showing)leave()});
{const pts=new Map;let one=null,raf=0,last=null,sx=0,sy=0;const at=e=>{const r=cv.getBoundingClientRect(),k=Math.min(r.width/cv.width,r.height/cv.height),w=cv.width*k,h=cv.height*k;return{x:(e.clientX-r.left-(r.width-w)/2)/w,y:(e.clientY-r.top-(r.height-h)/2)/h}};
const go=()=>{raf=0;if(last){send({t:'abs',p:'move',...last});last=null}if(sx||sy){send({t:'scroll',x:Math.round(sx),y:Math.round(sy)});sx=sy=0}};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){const p=at(e);one=setTimeout(()=>{one=0;send({t:'abs',p:'down',...p})},60)}else if(one){clearTimeout(one);one=null}};
cv.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;if(pts.size>1){sx+=e.clientX-p[0];sy+=e.clientY-p[1]}else if(one===0)last=at(e);pts.set(e.pointerId,[e.clientX,e.clientY]);if(!raf)raf=requestAnimationFrame(go)};
cv.onpointerup=cv.onpointercancel=e=>{if(!pts.delete(e.pointerId))return;if(one){clearTimeout(one);send({t:'abs',p:'down',...at(e)});one=0}if(one===0&&!pts.size){go();send({t:'abs',p:'up',...at(e)})}if(!pts.size)one=null}}
connect();
</script></body></html>
